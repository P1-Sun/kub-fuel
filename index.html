<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d97a00">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>КУБ Пальне</title>
<style>
:root{
  --bg:#f2f2f6; --card:#ffffff; --fg:#141518; --muted:#6c6f78; --line:#e3e3e8;
  --accent:#d97a00; --accent-soft:#fff1dc; --ok:#1f9d55; --ok-soft:#e3f6ea;
  --warn:#d63b2f; --warn-soft:#fde8e6; --info:#2f5bd3; --info-soft:#e8eefc; --wait:#6c6f78; --wait-soft:#ececf1; --ft:#9aa0ab;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1c1c1e; --fg:#f2f2f4; --muted:#9a9ca4; --line:#2e2e32;
  --accent:#ffa53a; --accent-soft:#3a2810; --ok:#3ccf7a; --ok-soft:#12301f;
  --warn:#ff6a5e; --warn-soft:#3a1714; --info:#7da2ff; --info-soft:#18213a; --wait:#9a9ca4; --wait-soft:#2a2a2e; --ft:#5f646e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Поведінка як у нативного застосунку: без синього підсвічування, виділення тексту і зуму від подвійного тапу */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,.tablebox,.kv,.why{-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:520px;margin:0 auto}
.wrap.wide{max-width:1180px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
h2{font-size:13px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px 4px}
.link{border:0;background:none;color:var(--accent);font-size:16px;padding:6px 2px;text-decoration:none}
.sync{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--ok-soft);color:var(--ok);font-weight:600;white-space:nowrap}
.sync.pend{background:var(--accent-soft);color:var(--accent)}
.sync.off{background:var(--wait-soft);color:var(--wait)}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:23px;font-weight:650;letter-spacing:-.01em;margin-top:2px;white-space:nowrap}
.tile .v small{font-size:14px;font-weight:500;color:var(--muted)}

.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .r{text-align:right;flex-shrink:0}
.row .r .l{font-weight:650;font-size:17px}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:15px;font-weight:700}
.ico.out{background:var(--accent-soft);color:var(--accent)}
.ico.in{background:var(--ok-soft);color:var(--ok)}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:15px}
.tag{font-size:12px;font-weight:600;color:var(--accent)}

.actions{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:15px 16px;font-size:17px;font-weight:600;background:var(--accent);color:#fff}
.btn.sec{background:var(--card);color:var(--accent)}
.btn.small{padding:9px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);margin:14px 4px 0}

/* PIN */
.pin{max-width:320px;margin:10vh auto 0;text-align:center}
.pin .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 14px;display:block}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 28px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--fg)}
.dots i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px;justify-content:center}
.pad button{width:76px;height:76px;border-radius:50%;border:0;background:var(--card);font-size:30px;font-weight:400}
.pad button.ghost{background:transparent;font-size:16px;color:var(--accent)}
.err{color:var(--warn);font-size:14px;min-height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;overflow-x:hidden;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));
  height:calc(100vh - 16px - env(safe-area-inset-top,0px));height:calc(100dvh - 16px - env(safe-area-inset-top,0px))}
.sheet .stack>*{min-width:0}
.sheet.center{border-radius:16px;margin:auto;height:auto;max-height:90vh}
.scrim.mid{align-items:center;padding:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:1;gap:8px}
.sheet-head b{font-size:17px}
.sheet-head.c3{display:grid;grid-template-columns:1fr auto 1fr}
.sheet-head.c3>:first-child{justify-self:start}
.sel{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:14px;padding:12px 14px}
.sel .main{flex:1;min-width:0}
.sel .t{font-size:19px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.sel .s{font-size:13px;color:var(--muted)}
.sel .check{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.sel .link{font-weight:600;flex-shrink:0}
.sheet .pick{max-height:calc(100vh - 330px);max-height:calc(100dvh - 330px - env(safe-area-inset-top,0px))}
.btn.send{width:100%;margin-top:6px;padding:17px}
.fsw{display:inline-flex;background:var(--bg);border-radius:8px;padding:2px;margin-top:6px}
.fsw button{border:0;background:transparent;font-size:13px;font-weight:600;padding:4px 12px;border-radius:6px;color:var(--muted)}
.fsw button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fsw button[data-fu="Бензин"][aria-pressed="true"]{background:var(--accent);color:#fff}
.two.one{grid-template-columns:1fr}
.ptag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--accent);color:#fff;vertical-align:1px}
.field{background:var(--card);border-radius:12px;padding:10px 14px}
.field label,.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.field input[type=text],.field input[type=number],.field input[type=search],.field textarea{width:100%;border:0;background:transparent;font-size:20px;font-weight:600;padding:2px 0;outline:none}
.field textarea{font-size:16px;font-weight:400;resize:vertical;min-height:60px}
.field input[type=number]{-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input::placeholder{color:var(--ft);font-weight:500}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.hint.bad{color:var(--warn)} .hint.good{color:var(--ok)}
.stack{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pick{max-height:230px;overflow:auto;border-radius:12px;background:var(--card)}
.pick button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 14px}
.pick button:last-child{border-bottom:0}
.pick button[aria-pressed="true"]{background:var(--accent-soft)}
.pick .s{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{position:relative;width:51px;height:31px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:31px;transition:.2s}
.sw span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(20px)}
.photo{display:flex;align-items:center;gap:12px;cursor:pointer}
.photo .ph{width:72px;height:54px;border-radius:8px;border:1.5px dashed var(--ft);display:grid;place-items:center;color:var(--muted);font-size:24px;flex-shrink:0;overflow:hidden}
.photo .ph img{width:100%;height:100%;object-fit:cover}
.geo{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ft);flex-shrink:0}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.dot.bad{background:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:15px;z-index:40;max-width:90vw;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}

/* dispatcher */
.bar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:14px;padding:14px 16px;min-width:0}
.panel h3{font-size:16px;margin:0 0 2px}
.panel .s{font-size:13px;color:var(--muted);margin:0 0 10px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.nf{background:var(--wait-soft);color:var(--wait)}
.pill.done{background:var(--info-soft);color:var(--info)}
.tablebox{overflow-x:auto;background:var(--card);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:960px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--bg)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.why{font-size:12px;color:var(--warn);margin-top:2px}
.alert{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:550;font-size:15px}
.alert .s{margin:0}
.mbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;border-radius:4px}
.search{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:15px;min-width:0;flex:1;max-width:280px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:550}
.bigphoto{width:100%;border-radius:12px;background:var(--card);min-height:120px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>

<script>
/* ===================== НАЛАШТУВАННЯ ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbx650hHSvyvJaMIOoiBqnOB9VrkGmAoOduIN_jrkbLUQ01bXkLuRQInzjNKUj8_Ar1l/exec'; // https://script.google.com/macros/s/.../exec

/* ===================== УТИЛІТИ ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('uk-UA');
const fmt1 = n => n == null || isNaN(n) ? '—' : (Math.round(n*10)/10).toLocaleString('uk-UA',{maximumFractionDigits:1});
const sgn = n => n == null ? '—' : (n > 0 ? '+' : '') + fmt1(n);
const pad2 = n => String(n).padStart(2,'0');
const dKey = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const tStr = iso => { const d = new Date(iso); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const dShort = iso => new Date(iso).toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'});
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function toast(t, ms=2400){ const el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), ms); }
function driveId(url){ const m = String(url||'').match(/\/d\/([\w-]+)/); return m ? m[1] : null; }
function thumb(url, w=400){ const id = driveId(url); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w${w}` : ''; }
function distM(a1,o1,a2,o2){ const r=x=>x*Math.PI/180; const da=r(a2-a1), dn=r(o2-o1); const h=Math.sin(da/2)**2+Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dn/2)**2; return 2*6371000*Math.asin(Math.sqrt(h)); }

const FUELS = ['ДП','Бензин'];
const isPet = r => r.fuel === 'Бензин';
const fuelSw = (id) => `<div class="fsw" role="group" aria-label="Тип пального" id="${id}">${FUELS.map((x,i)=>`<button type="button" data-fu="${x}" aria-pressed="${i===0}">${x}</button>`).join('')}</div>`;
function bindFuelSw(id, onChange){ $$('#'+id+' [data-fu]').forEach(b => b.onclick = () => { $$('#'+id+' [data-fu]').forEach(x=>x.setAttribute('aria-pressed', x===b)); onChange(b.dataset.fu); }); }
const ptag = r => isPet(r) ? ' <span class="ptag">бензин</span>' : '';

/* ===================== API ===================== */
const S = { pin: ls.get('pin', null), refs: ls.get('refs', null), view: null, day: ls.get('day', null), dash: null, period: 7, dtab: 'overview', filter: 'all', q: '' };

async function api(action, payload={}){
  if (!API_URL.startsWith('https://')) throw new Error('Не вказано API_URL у index.html');
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action, pin: S.pin, ...payload }) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Помилка'); e.code = j.code; throw e; }
  return j.data;
}

/* ===================== ОФЛАЙН-ЧЕРГА (IndexedDB) ===================== */
const Q = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db); return new Promise((res, rej) => { const r = indexedDB.open('kub', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'clientId' }); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('q', mode); const st = t.objectStore('q'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); },
  all(){ return this.tx('readonly', st => st.getAll()); },
  put(x){ return this.tx('readwrite', st => st.put(x)); },
  del(id){ return this.tx('readwrite', st => st.delete(id)); }
};
let pending = [];
let syncing = false;
async function refreshPending(){ try { pending = (await Q.all()) || []; } catch(e){ pending = []; } }
async function syncQueue(){
  if (syncing || !navigator.onLine || !S.pin) return;
  syncing = true;
  try {
    await refreshPending();
    for (const item of pending.sort((a,b)=>a.ts.localeCompare(b.ts))) {
      try {
        const res = await api('add', { rec: item });
        await Q.del(item.clientId);
        if (res && S.refs?.user?.role === 'Диспетчер') {
          const c = res.cons, m = S.refs.machines.find(x=>x.id===item.machineId);
          const cs = c && c.rate!=null ? `Розхід ${fmt1(c.rate)} ${m&&m.unit==='км'?'л/100км':'л/м/г'}${c.dev!=null?' ('+sgn(c.dev)+'% від норми)':''}` : (c && c.method ? c.method : '');
          const msg = [cs, res.reason ? 'Перевірити: ' + res.reason : ''].filter(Boolean).join(' · ');
          if (msg) toast(msg, 4500);
        }
      } catch(e) {
        if (e.code === 'auth') { logout(); return; }
        if (/Failed to fetch|NetworkError|Load failed/i.test(e.message)) break;
        item.error = e.message; await Q.put(item); // помилка даних — лишаємо, показуємо
      }
    }
    await refreshPending();
    if (S.view === 'fuel') loadDay(true);
  } finally { syncing = false; renderSync(); }
}
window.addEventListener('online', () => { renderSync(); syncQueue(); });
window.addEventListener('offline', renderSync);
setInterval(syncQueue, 30000);

function renderSync(){
  const el = $('#sync'); if (!el) return;
  const n = pending.length;
  if (!navigator.onLine) { el.className = 'sync off'; el.textContent = n ? `Офлайн · ${n} в черзі` : 'Офлайн'; }
  else if (n) { el.className = 'sync pend'; el.textContent = `Надсилаю ${n}…`; }
  else { el.className = 'sync'; el.textContent = 'Усе надіслано'; }
}

/* ===================== ВХІД ===================== */
function renderLogin(msg=''){
  S.view = 'login';
  let pin = '';
  $('#app').innerHTML = `<div class="pin">
    <img class="logo" src="icon-192.png" alt="">
    <h1 style="font-size:24px">КУБ · Пальне</h1>
    <div class="sub" style="margin:0">Введіть PIN</div>
    <div class="dots" id="dots">${'<i></i>'.repeat(4)}</div>
    <div class="err" id="perr">${esc(msg)}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<span></span><button data-k="0">0</button><button class="ghost" data-k="del">Стерти</button></div>
  </div>`;
  const draw = () => $$('#dots i').forEach((d,i)=>d.classList.toggle('on', i < pin.length));
  $$('.pad [data-k]').forEach(b => b.onclick = async () => {
    const k = b.dataset.k;
    if (k === 'del') pin = pin.slice(0,-1); else if (pin.length < 4) pin += k;
    draw();
    if (pin.length === 4) {

/* ---- геолокація ---- */
function getGeo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res({ err: 'Телефон не підтримує GPS' });
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      e => res({ err: e.code === 1 ? 'Дозвольте доступ до геолокації' : 'Не вдалося визначити місце' }),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
    );
  });
}
function nearestObj(g){
  let best = null;
  (S.refs.objects||[]).forEach(o => { const d = distM(g.lat,g.lon,o.lat,o.lon); if (d <= o.r && (!best || d < best.d)) best = { name:o.name, d }; });
  return best;
}

/* ---- фото: стискання + підпис на кадрі ---- */
async function makePhoto(file, lines){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Не вдалося відкрити фото')); i.src = url; });
    const max = 1280, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
    const fs = Math.max(16, Math.round(w/38)), padd = Math.round(fs*.6), lh = Math.round(fs*1.3);
    const bh = lines.length*lh + padd*2;
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, h-bh, w, bh);
    x.fillStyle = '#fff'; x.font = `600 ${fs}px sans-serif`; x.textBaseline = 'top';
    lines.forEach((t, i) => x.fillText(t, padd, h - bh + padd + i*lh));
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
function photoInput(id, boxId, hintId, onPick){
  $('#'+id).onchange = e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    const ageMin = (Date.now() - f.lastModified) / 60000;
    const lim = S.refs.settings?.photoFreshMin || 10;
    if (ageMin > lim) { $('#'+hintId).className = 'hint bad'; $('#'+hintId).textContent = `Фото зроблене ${Math.round(ageMin)} хв тому. Сфотографуйте зараз`; return; }
    const prev = URL.createObjectURL(f);
    $('#'+boxId).innerHTML = `<img src="${prev}" alt="">`;
    $('#'+hintId).className = 'hint good'; $('#'+hintId).textContent = 'Фото додано · ' + tStr(new Date().toISOString());
    onPick(f);
  };
}

function stOf(r){
  if (r.status === 'Перевірено') return 'done';
  if (r.status === 'Перевірити') return 'warn';
  if (r.status === 'Збігається') return 'ok';
  if (r.status === 'Без FreeTrack') return 'nf';
  return 'wait';

const stLabel = { done:'Перевірено', warn:'Перевірити', ok:'Збігається', wait:'Очікує FreeTrack', nf:'Без FreeTrack' };
const stText = (r, st) => st==='wait' && r.type==='out' ? 'Звірка за день' : stLabel[st];

const consUnit = id => (S.refs.machines.find(m=>m.id===id)||{}).unit==='км' ? 'л/100км' : 'л/м/г';
const consTol = () => S.refs.settings?.consTolP || 15;
const consBad = r => r.cons!=null && r.consDev!=null && Math.abs(r.consDev) > consTol();
const consKind = r => /^Середній/.test(r.consMethod||'') ? '≈ середній' : 'точний';
function consCell(r){
  if (r.type !== 'out') return '—';
  if (r.cons == null) return `<span class="hint">${esc(r.consMethod||'—')}</span>`;
  const col = r.consDev==null ? 'var(--fg)' : consBad(r) ? 'var(--warn)' : 'var(--ok)';
  return `<b class="num" style="color:${col}">${fmt1(r.cons)}</b> <span class="hint">${consUnit(r.machineId)}</span><div class="hint" style="margin:0">${consKind(r)}${r.consDev!=null?' · '+sgn(r.consDev)+'% від норми':''}</div>`;
}

function consumption(recs){
  const R = S.refs;
  return R.machines.map(m => {
    const rs = recs.filter(r=>r.type==='out' && r.machineId===m.id && r.value!=null).sort((a,b)=>a.ts.localeCompare(b.ts));
    let lit=0, units=0, anchor=null, acc=0;
    rs.forEach(r => {
      if (anchor) { acc += r.liters; if (r.max) { const d = r.value - anchor.value; if (d > 0 && r.inPeriod) { lit += acc; units += d; } anchor = r; acc = 0; } }
      else if (r.max) { anchor = r; acc = 0; }
    });
    const inP = rs.filter(r=>r.inPeriod);
    const rate = units > 0 ? (m.unit==='км' ? lit/units*100 : lit/units) : null;
    return { m, n: inP.length, lit: inP.reduce((s,r)=>s+r.liters,0), units: units||null, rate,
      dev: rate && m.norm ? (rate/m.norm - 1)*100 : null };
  }).filter(c => c.n > 0).sort((a,b)=>b.lit-a.lit);
}

function chartSvg(recs, from, to, fdays, pist){
  const fdm = {}; (fdays||[]).forEach(x => fdm[x.day] = x.used);
  (pist||[]).forEach(x => { const k = dKey(new Date(x.start)); fdm[k] = (fdm['p'+k] ? fdm[k] : 0) + x.liters; fdm['p'+k] = 1; }); // пістолет має перевагу над лінійкою
  const days = []; const d0 = new Date(from+'T00:00:00'), d1 = new Date(to+'T00:00:00');
  for (let d = new Date(d0); d <= d1; d.setDate(d.getDate()+1)) days.push(dKey(d));
  const per = days.map(k => { const rs = recs.filter(r=>r.day===k && r.type==='out'); return { k, out: rs.reduce((s,r)=>s+r.liters,0), ft: Math.max(0, fdm[k] || 0) }; });
  const mx = Math.max(100, ...per.map(p=>Math.max(p.out,p.ft)));
  const step = mx > 2000 ? 500 : mx > 800 ? 200 : 100;
  const top = Math.ceil(mx/step)*step;
  const W=640, H=240, L=46, B=26, T=10, cw=(W-L-8)/per.length, y=v=>T+(H-T-B)*(1-v/top);
  const every = Math.ceil(per.length/10);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Видано по днях: внесено в додатку і за лінійкою">`;
  for (let g=0; g<=top; g+=step) s += `<line x1="${L}" x2="${W-8}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${g}</text>`;
  per.forEach((p,i) => {
    const bw = Math.min(26, Math.max(2, cw*.32)), x = L + i*cw + (cw - bw*2 - 2)/2;
    s += `<rect x="${x}" y="${y(p.out)}" width="${bw}" height="${y(0)-y(p.out)}" rx="2" fill="var(--accent)"><title>${p.k}: внесено ${fmt1(p.out)} л</title></rect>`;
    s += `<rect x="${x+bw+2}" y="${y(p.ft)}" width="${bw}" height="${y(0)-y(p.ft)}" rx="2" fill="var(--ft)"><title>${p.k}: FreeTrack ${fmt1(p.ft)} л</title></rect>`;
    if (i % every === 0) s += `<text x="${L+i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${p.k.slice(8)}.${p.k.slice(5,7)}</text>`;
  });
  return s + '</svg>';
}

/* ---- Імпорт звіту FreeTrack «Звіт по заправних станціях» (xlsx / csv) ---- */
function loadScript(src){ return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Не вдалося завантажити модуль читання Excel')); document.head.appendChild(s); }); }
function parsePistolRows(rows){
  const items = []; let day = null;
  const tm = v => { const m = String(v||'').trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/); return m ? `${pad2(m[1])}:${m[2]}:${m[3]||'00'}` : null; };
  rows.forEach(r => {
    const a = String(r[0] ?? '').trim();
    const dm = a.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2,4})$/);
    if (dm) { const y = dm[3].length === 2 ? '20' + dm[3] : dm[3]; day = `${y}-${pad2(dm[2])}-${pad2(dm[1])}`; return; }
    if (!day || !/^\d+$/.test(a)) return;
    const s = tm(r[1]), e = tm(r[2]);
    const l = parseFloat(String(r[5] ?? '').replace(',', '.'));
    if (!s || !(l > 0)) return;
    items.push({ start: `${day}T${s}`, end: e ? `${day}T${e}` : null, liters: l, card: String(r[4] ?? '').trim() });
  });
  return items;
}
async function importPistol(file){
  toast('Читаю файл…');
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    const items = parsePistolRows(rows);
    if (!items.length) throw new Error('Це не схоже на «Звіт по заправних станціях» FreeTrack');
    const r = await api('pistol', { items });
    toast(`Пістолет: ${r.total} видач · ✅ ${r.ok}${r.diff?` · ⚠️ ${r.diff}`:''}${r.none?` · 🚨 без запису ${r.none}`:''}${r.missing?` · ❓ немає на пістолеті ${r.missing}`:''}`, 6000);
    loadDash();
  } catch(e) { toast(e.message, 5000); }
}

        ${r.type==='out'?`<dt>Місце</dt><dd>${placeTxt(r)}${map?` · <a class="link" href="${map}" target="_blank" rel="noopener">карта</a>`:''}${r.acc!=null?` <span class="hint">±${fmt(r.acc)} м</span>`:''}</dd>`:''}
        <dt>Заправник</dt><dd>${esc(r.fueler)}</dd>
        <dt>Статус</dt><dd><span class="pill ${st}">${stText(r,st)}</span>${r.reason?`<div class="why">${esc(r.reason)}</div>`:''}</dd>
      </dl></div>
      <div class="field"><label for="nt">Примітка диспетчера</label><textarea id="nt" placeholder="Наприклад: оператор підтвердив по телефону">${esc((r.note||'').replace(/ — [^—]+$/,''))}</textarea></div>
      <div class="two">
        <button class="btn small sec" id="saveNote">Зберегти примітку</button>
        ${st==='done'?`<button class="btn small sec" id="unmark">Повернути на перевірку</button>`:`<button class="btn small" id="mark">Позначити перевіреним</button>`}
      </div>
    </div></div></div>`;
  $('#x').onclick = () => $('#layer').innerHTML = '';
  const send = async (payload, msg) => {
    try { await api('mark', { id: r.id, ...payload }); toast(msg); $('#layer').innerHTML=''; loadDash(); }
    catch(e) { toast(e.message); }
  };
  $('#saveNote').onclick = () => send({ note: $('#nt').value }, 'Примітку збережено');
  if ($('#mark')) $('#mark').onclick = () => send({ status: 'Перевірено', note: $('#nt').value }, 'Позначено перевіреним');
  if ($('#unmark')) $('#unmark').onclick = () => send({ status: 'Перевірити' }, 'Повернуто на перевірку');
}

/* ===================== СТАРТ ===================== */
function route(){
  if (!S.pin || !S.refs) return renderLogin();
  if (S.refs.user.role === 'Диспетчер') { renderDisp(); loadDash(); }
  else { renderFuel(); loadDay(true); }
}
(async function boot(){
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  await refreshPending();
  route();
  if (S.pin) {
    api('refs').then(r => { S.refs = r; ls.set('refs', r); }).catch(e => { if (e.code === 'auth') logout(); });
    syncQueue();
  }
})();
</script>
